services:
  feiyubot:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      FEIYU_DATA_DIR: /data
      FEIYU_ADMIN_PASSWORD: ${FEIYU_ADMIN_PASSWORD:-feiyu-admin}
    volumes:
      - feiyu-data:/data

volumes:
  feiyu-data:
