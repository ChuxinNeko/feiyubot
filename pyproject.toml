[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feiyubot"
version = "0.1.0"
description = "基于 NoneBot2 与 OneBot v11 的 QQ 陪伴机器人"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nonebot2[fastapi]>=2.4.3,<3",
  "nonebot-adapter-onebot>=2.4.6,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["feiyubot*"]

[tool.setuptools.package-data]
"feiyubot.web" = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
